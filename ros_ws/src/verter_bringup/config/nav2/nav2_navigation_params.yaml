# Navigation and obstacle observations; see docs/COSTMAP.md before hardware use.

amcl:
  ros__parameters:
    use_sim_time: false
    alpha1: 0.2 # rotation noise from rotation
    alpha2: 0.2 # rotation noise from translation
    alpha3: 0.2 # translation noise from translation
    alpha4: 0.2 # translation noise from rotation
    alpha5: 0.2 # strafe noise (diff drive: irrelevant but keep)
    base_frame_id: base_footprint
    beam_skip_distance: 0.5
    beam_skip_error_threshold: 0.9
    beam_skip_threshold: 0.3
    do_beamskip: false
    global_frame_id: map
    lambda_short: 0.1
    laser_likelihood_max_dist: 2.0
    laser_max_range: 5.5
    laser_min_range: 0.20
    laser_model_type: likelihood_field
    max_beams: 60
    max_particles: 2000
    min_particles: 500
    odom_frame_id: odom
    pf_err: 0.05
    pf_z: 0.99
    recovery_alpha_fast: 0.0
    recovery_alpha_slow: 0.0
    resample_interval: 1
    robot_model_type: nav2_amcl::DifferentialMotionModel
    save_pose_rate: 0.5
    sigma_hit: 0.2
    tf_broadcast: true
    transform_tolerance: 0.5 # generous вЂ” matches Jetson CPU headroom
    update_min_a: 0.05
    update_min_d: 0.05
    z_hit: 0.5
    z_max: 0.05
    z_rand: 0.5
    z_short: 0.05
    scan_topic: /scan

bt_navigator:
  ros__parameters:
    use_sim_time: false
    global_frame: map
    robot_base_frame: base_footprint
    odom_topic: /odometry/filtered
    bt_loop_duration: 10
    default_server_timeout: 20

controller_server:
  ros__parameters:
    use_sim_time: false

    controller_frequency: 10.0

    min_x_velocity_threshold: 0.001
    min_y_velocity_threshold: 0.001
    min_theta_velocity_threshold: 0.001

    failure_tolerance: 0.3
    odom_topic: /odometry/filtered

    progress_checker_plugin: progress_checker
    goal_checker_plugins: [general_goal_checker]
    controller_plugins: [FollowPath]

    progress_checker:
      plugin: nav2_controller::SimpleProgressChecker
      required_movement_radius: 0.05
      movement_time_allowance: 30.0

    general_goal_checker:
      plugin: nav2_controller::SimpleGoalChecker
      stateful: true
      xy_goal_tolerance: 0.10
      yaw_goal_tolerance: 0.10

    FollowPath:
      plugin: nav2_regulated_pure_pursuit_controller::RegulatedPurePursuitController

      desired_linear_vel: 0.04

      lookahead_dist: 0.30
      min_lookahead_dist: 0.20
      max_lookahead_dist: 0.50
      lookahead_time: 1.5
      use_velocity_scaled_lookahead_dist: true

      rotate_to_heading_angular_vel: 0.15
      rotate_to_heading_min_angle: 0.5
      use_rotate_to_heading: true
      allow_reversing: false

      transform_tolerance: 0.2

      min_approach_linear_velocity: 0.02
      approach_velocity_scaling_dist: 0.30

      use_collision_detection: true
      max_allowed_time_to_collision_up_to_carrot: 2.0

      use_regulated_linear_velocity_scaling: true
      use_cost_regulated_linear_velocity_scaling: false

      regulated_linear_scaling_min_radius: 0.5
      regulated_linear_scaling_min_speed: 0.01

      max_angular_accel: 1.0

smoother_server:
  ros__parameters:
    use_sim_time: false
    smoother_plugins: [simple_smoother]
    simple_smoother:
      plugin: nav2_smoother::SimpleSmoother
      tolerance: 1.0e-10
      max_its: 1000
      do_refinement: true

planner_server:
  ros__parameters:
    use_sim_time: false
    planner_plugins: [GridBased]
    GridBased:
      plugin: nav2_navfn_planner/NavfnPlanner
      tolerance: 0.2
      use_astar: false
      allow_unknown: false

behavior_server:
  ros__parameters:
    use_sim_time: false
    local_costmap_topic: local_costmap/costmap_raw
    global_costmap_topic: global_costmap/costmap_raw
    local_footprint_topic: local_costmap/published_footprint
    global_footprint_topic: global_costmap/published_footprint
    cycle_frequency: 10.0
    behavior_plugins: [spin, backup, drive_on_heading, wait, assisted_teleop]
    spin:
      plugin: nav2_behaviors/Spin
    backup:
      plugin: nav2_behaviors/BackUp
    drive_on_heading:
      plugin: nav2_behaviors/DriveOnHeading
    wait:
      plugin: nav2_behaviors/Wait
    assisted_teleop:
      plugin: nav2_behaviors/AssistedTeleop
    local_frame: odom
    global_frame: map
    robot_base_frame: base_footprint
    transform_tolerance: 0.2
    simulate_ahead_time: 2.0
    max_rotational_vel: 0.5
    min_rotational_vel: 0.1
    rotational_acc_lim: 1.0

waypoint_follower:
  ros__parameters:
    use_sim_time: false
    loop_rate: 20
    stop_on_failure: false
    action_server_result_timeout: 900.0
    waypoint_task_executor_plugin: wait_at_waypoint
    wait_at_waypoint:
      plugin: nav2_waypoint_follower::WaitAtWaypoint
      enabled: true
      waypoint_pause_duration: 200

local_costmap:
  local_costmap:
    ros__parameters:
      use_sim_time: false
      update_frequency: 10.0
      publish_frequency: 5.0
      global_frame: odom
      robot_base_frame: base_footprint
      transform_tolerance: 0.2
      rolling_window: true
      width: 4
      height: 4
      resolution: 0.05
      # CAD bounding rectangle about the drive axle; padding is NOT obstacle clearance.
      footprint: '[[0.175, 0.267], [-0.414, 0.267], [-0.414, -0.267], [0.175, -0.267]]'
      footprint_padding: 0.01
      plugins: [lidar_layer, camera_layer, ultrasonic_layer, inflation_layer]
      lidar_layer:
        plugin: nav2_costmap_2d::ObstacleLayer
        enabled: true
        combination_method: 1
        observation_sources: scan
        scan:
          topic: /scan
          max_obstacle_height: 1.5
          clearing: true
          marking: true
          data_type: LaserScan
          observation_persistence: 0.0
          expected_update_rate: 0.5
          raytrace_max_range: 5.5
          raytrace_min_range: 0.0
          obstacle_max_range: 5.0
          obstacle_min_range: 0.0
      camera_layer:
        plugin: nav2_costmap_2d::VoxelLayer
        enabled: true
        combination_method: 1
        publish_voxel_map: false
        origin_z: 0.0
        z_resolution: 0.10
        z_voxels: 16
        max_obstacle_height: 1.5
        unknown_threshold: 15
        mark_threshold: 0
        observation_sources: depth_mark depth_clear
        depth_mark:
          topic: /perception/depth/points
          data_type: PointCloud2
          marking: true
          clearing: false
          min_obstacle_height: 0.08
          max_obstacle_height: 1.5
          obstacle_min_range: 0.25
          obstacle_max_range: 4.0
          observation_persistence: 0.0
          expected_update_rate: 0.5
        depth_clear:
          topic: /perception/depth/points
          data_type: PointCloud2
          marking: false
          clearing: true
          min_obstacle_height: -0.05
          max_obstacle_height: 1.6
          raytrace_min_range: 0.0
          raytrace_max_range: 4.5
          observation_persistence: 0.0
          expected_update_rate: 0.5
      ultrasonic_layer:
        plugin: nav2_costmap_2d::RangeSensorLayer
        enabled: true
        input_sensor_type: VARIABLE
        topics:
          - /perception/ultrasonic/right
          - /perception/ultrasonic/front_right_outer
          - /perception/ultrasonic/front_right_inner
          - /perception/ultrasonic/front_center
          - /perception/ultrasonic/front_left_inner
          - /perception/ultrasonic/front_left_outer
          - /perception/ultrasonic/left
        phi: 1.2
        inflate_cone: 0.0
        clear_threshold: 0.2
        mark_threshold: 0.8
        clear_on_max_reading: false
        # Humble latches current=false after timeout. Freshness is diagnostic
        # only for this untimestamped array; no echo never proves free space.
        no_readings_timeout: 0.0
      inflation_layer:
        plugin: nav2_costmap_2d::InflationLayer
        cost_scaling_factor: 3.0
        inflation_radius: 0.40
      always_send_full_costmap: false

global_costmap:
  global_costmap:
    ros__parameters:
      use_sim_time: false
      update_frequency: 1.0
      publish_frequency: 1.0
      global_frame: map
      robot_base_frame: base_footprint
      transform_tolerance: 0.2
      # CAD bounding rectangle about the drive axle; padding is NOT obstacle clearance.
      footprint: '[[0.175, 0.267], [-0.414, 0.267], [-0.414, -0.267], [0.175, -0.267]]'
      footprint_padding: 0.01
      resolution: 0.05
      track_unknown_space: true
      plugins: [static_layer, lidar_layer, camera_layer, ultrasonic_layer, inflation_layer]
      static_layer:
        plugin: nav2_costmap_2d::StaticLayer
        map_subscribe_transient_local: true
      lidar_layer:
        plugin: nav2_costmap_2d::ObstacleLayer
        enabled: true
        combination_method: 1
        observation_sources: scan
        scan:
          topic: /scan
          max_obstacle_height: 1.5
          clearing: true
          marking: true
          data_type: LaserScan
          observation_persistence: 0.0
          expected_update_rate: 0.5
          raytrace_max_range: 5.5
          raytrace_min_range: 0.0
          obstacle_max_range: 5.0
          obstacle_min_range: 0.0
      camera_layer:
        plugin: nav2_costmap_2d::VoxelLayer
        enabled: true
        combination_method: 1
        publish_voxel_map: false
        origin_z: 0.0
        z_resolution: 0.10
        z_voxels: 16
        max_obstacle_height: 1.5
        unknown_threshold: 15
        mark_threshold: 0
        observation_sources: depth_mark depth_clear
        depth_mark:
          topic: /perception/depth/points
          data_type: PointCloud2
          marking: true
          clearing: false
          min_obstacle_height: 0.08
          max_obstacle_height: 1.5
          obstacle_min_range: 0.25
          obstacle_max_range: 4.0
          observation_persistence: 0.0
          expected_update_rate: 0.5
        depth_clear:
          topic: /perception/depth/points
          data_type: PointCloud2
          marking: false
          clearing: true
          min_obstacle_height: -0.05
          max_obstacle_height: 1.6
          raytrace_min_range: 0.0
          raytrace_max_range: 4.5
          observation_persistence: 0.0
          expected_update_rate: 0.5
      ultrasonic_layer:
        plugin: nav2_costmap_2d::RangeSensorLayer
        enabled: true
        input_sensor_type: VARIABLE
        topics:
          - /perception/ultrasonic/right
          - /perception/ultrasonic/front_right_outer
          - /perception/ultrasonic/front_right_inner
          - /perception/ultrasonic/front_center
          - /perception/ultrasonic/front_left_inner
          - /perception/ultrasonic/front_left_outer
          - /perception/ultrasonic/left
        phi: 1.2
        inflate_cone: 0.0
        clear_threshold: 0.2
        mark_threshold: 0.8
        clear_on_max_reading: false
        # Humble latches current=false after timeout. Freshness is diagnostic
        # only for this untimestamped array; no echo never proves free space.
        no_readings_timeout: 0.0
      inflation_layer:
        plugin: nav2_costmap_2d::InflationLayer
        cost_scaling_factor: 3.0
        inflation_radius: 0.40
      always_send_full_costmap: false

map_server:
  ros__parameters:
    use_sim_time: false
    yaml_filename: '' # overridden by nav2_navigation.launch.py argument

lifecycle_manager:
  ros__parameters:
    use_sim_time: false
    autostart: true
    node_names:
      - map_server
      - amcl
      - controller_server
      - smoother_server
      - planner_server
      - behavior_server
      - bt_navigator
      - waypoint_follower
