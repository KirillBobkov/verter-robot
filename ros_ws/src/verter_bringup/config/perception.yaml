depth_obstacles:
  ros__parameters:
    image_topic: /camera/depth/image_raw
    camera_info_topic: /camera/depth/camera_info
    points_topic: /perception/depth/points
    status_topic: /perception/depth/status
    base_frame: base_footprint
    stride: 4
    max_rate: 5.0
    min_depth: 0.25
    max_depth: 4.0
    # Keep ground returns for 3D clearing; the costmap marks only above 0.08 m.
    min_height: -0.05
    max_height: 1.6
    self_bounds: [-0.434, 0.195, -0.287, 0.287]
    max_frame_age: 0.5
    future_tolerance: 0.1
    status_timeout: 0.75

ultrasonic_ranges:
  ros__parameters:
    min_range: 0.02
    max_range: 2.0
    # Provisional full cone width, pending physical sensor acceptance.
    field_of_view: 0.26
    output_rate_hz: 10.0
