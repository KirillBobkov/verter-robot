site_name: Вертер — Документация
site_description: Документация автономного мобильного робота Verter

theme:
  name: material
  language: ru
  features:
    - navigation.instant
    - navigation.sections
    - navigation.tracking
    - navigation.expand
    - content.code.copy

markdown_extensions:
  - admonition
  - toc:
      permalink: true
  - pymdownx.superfences
  - pymdownx.details

plugins:
  - search

nav:
  - 1. Установка:
      - Ubuntu + ROS2: v2/os_setup.md
      - udev-правила: v2/udev_rules.md
      - Сборка проекта: v2/project_build.md

  - 2. Запуск:
      - Launch-файлы: v2/launch_files.md
      - WiFi — подключение к сети: v2/wifi_connect.md
      - Удалённый доступ (SSH, RViz): v2/remote_access.md

  - 3. Железо:
      - ESP32 + micro-ROS: v2/hardware.md
      - Подключение шасси ZLAC8015D: v2/chassis_wiring.md

  - 4. Навигация:
      - Архитектура (SDHR, twist_mux, QoS): v2/navigation/architecture.md
      - Автономное картографирование: v2/navigation/autonomous_mapping.md
      - Карты и путевые точки: v2/navigation/maps_waypoints.md
      - Одометрия: v2/odometry.md

  - 5. Диагностика:
      - Быстрая проверка: v2/diagnostics/quick_check.md
      - Systemd-сервис: v2/diagnostics/service.md
      - ROS2-ноды: v2/diagnostics/ros_nodes.md
      - LiDAR: v2/diagnostics/lidar.md
      - USB: v2/diagnostics/usb.md
      - Аудио: v2/diagnostics/audio.md
      - Логи: v2/diagnostics/logs.md

  - 6. Справочник проблем:
      - Аудио система: v2/problems_solved/audio_system.md
      - SLAM / Локализация: v2/problems_solved/slam_localization.md
      - Навигация: v2/problems_solved/navigation.md
      - Speech-to-Text: v2/problems_solved/speech_to_text.md
      - USB-Serial / CH340: v2/problems_solved/usb_serial.md
      - ESP32 / micro-ROS: v2/problems_solved/esp32_microros.md
      - Система и сервисы: v2/problems_solved/system_services.md
      - WiFi Connect: v2/problems_solved/wifi_connect_problems.md
      - Прочее: v2/problems_solved/misc.md

  - FAQ: v2/faq.md
