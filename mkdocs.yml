site_name: Документация по проекту Вертер
site_description: Документация по проекту verter-robot

theme:
  name: material
  language: ru
  features:
    - navigation.instant
    - navigation.sections
    - navigation.tracking
    - content.code.copy

markdown_extensions:
  - admonition
  - toc:
      permalink: true
  - pymdownx.superfences
  - pymdownx.details

plugins:
  - search

nav:
  - Главная: index.md
  - Кодовая документация:
      - Обзор: code/verter_admin.md
      - Ноды:
          - speech_to_text_* (STT): code/nodes/speech_to_text_node.md
          - recognition_node: code/nodes/recognition_node.md
          - ai_assistant_node: code/nodes/ai_assistant_node.md
          - text_to_speech_node: code/nodes/text_to_speech_node.md
          - silero_tts_node: code/nodes/silero_tts_node.md
          - sound_player_node: code/nodes/sound_player_node.md
          - chassis_node: code/nodes/chassis_node.md
          - distance_sensors_node: code/nodes/distance_sensors.md
          - doa_node: code/nodes/doa_node.md
          - odometry_node: code/nodes/odometry_node.md
          - teleop_keyboard: code/nodes/teleop_keyboard.md
          - waypoint_navigator: code/nodes/waypoint_navigator.md
          - Теслик играет в мяч: plans/teslik.md
      - API:
          - Интерфейсы и топики: code/api.md
          - Топики (справка): code/api/topics.md
      - Инженерия и план:
          - План разработки: code/engineering/DEVELOPMENT_PLAN.md
          - Итоги фазы 1: code/engineering/PHASE1_SUMMARY.md
          - Итоги чистки/рефакторинга: code/engineering/CLEANUP_SUMMARY.md
          - Оптимизация: code/engineering/OPTIMIZATION_NOTES.md
      - Заметки разработки:
          - Odometry: code/dev/odometry.md
          - Тест-кейсы голосового пайплайна: code/dev/speech_pipeline_test_cases.md
          - Журнал изменений URDF: code/dev/urdf_changes_log.md
          - Параметры URDF к замеру: code/dev/urdf_parameters_to_measure.md
          - Архив:
              - Тест-кейсы распознавания (Vosk, legacy): code/dev/legacy/vosk_speech_recognition_test_cases.md
  - Проектная документация:
      - Обзор: project/verter_admin.md
      - Цель проекта: project/PROJECT_GOAL.md
      - FAQ: project/FAQ.md
      - Установка и запуск:
          - Предпосылки: project/getting_started/prerequisites.md
          - Сборка и установка: project/getting_started/install.md
          - Первый запуск: project/getting_started/run.md
      - Руководство оператора:
          - Голосовое управление: project/guides/voice.md
          - Навигация и карты:
              - Автономное картирование: project/navigation/AUTONOMOUS_MAPPING.md
              - Карты (SLAM): project/navigation/MAPS_GUIDE.md
              - Waypoints: project/navigation/WAYPOINTS_GUIDE.md
              - Высота лидара (обоснование): project/navigation/LIDAR_HEIGHT_ANALYSIS.md
      - Эксплуатация:
          - Systemd-сервис: project/operations/services.md
          - Диагностика: project/operations/diagnostics.md
      - Сеть и подключение:
          - WiFi на Raspberry Pi (nmcli): project/networking/raspberry_pi_wifi.md
          - WiFi Connect:
              - Обзор: project/networking/wifi-connect/index.md
              - Решенные проблемы: project/networking/wifi-connect/PROBLEMS-SOLVED.md
  - Аппаратная часть:
      - Обзор: hardware.md


