# Именованные точки (waypoints) для навигации
# Каждая точка содержит: название, координаты (x, y), ориентацию (yaw)
#
# Формат:
# - name: "Название места"
#   x: 1.23      # метры от начала координат карты
#   y: 4.56      # метры от начала координат карты
#   yaw: 0.0     # ориентация в радианах (0 = на восток, 1.57 = на север)
#   description: "Дополнительное описание"

waypoints:
  # Пример точек (удалите или измените по необходимости)
  - name: "Стартовая позиция"
    x: 0.0
    y: 0.0
    yaw: 0.0
    description: "Точка старта робота"

  # Добавьте свои точки используя скрипт save_waypoint.sh
  # Пример:
  # - name: "Кабинет директора"
  #   x: 5.2
  #   y: 3.1
  #   yaw: 1.57
  #   description: "Кабинет на втором этаже"
