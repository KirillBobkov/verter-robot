# ============================================================================
# EXPLORE_LITE CONFIGURATION FOR VERTER ROBOT
# ============================================================================
#
# Explore Lite - автономное исследование на основе frontier exploration
#
# Что это:
# --------
# Explore Lite находит "границы" (frontiers) между известным и неизвестным
# пространством на карте и отправляет робота к этим границам для исследования.
#
# Интеграция:
# -----------
# - Работает с SLAM Toolbox для построения карты
# - Использует Nav2 для навигации к целям
# - Требует costmap для планирования пути
#
# ============================================================================

explore:
  ros__parameters:
    use_sim_time: False

    # ========================================================================
    # ОСНОВНЫЕ ПАРАМЕТРЫ
    # ========================================================================

    # Робот и координатная система
    robot_base_frame: base_link
    costmap_topic: /global_costmap/costmap
    costmap_updates_topic: /global_costmap/costmap_updates
    visualize: True  # Публикует маркеры для визуализации границ в RViz

    # ========================================================================
    # FRONTIER DETECTION (ОБНАРУЖЕНИЕ ГРАНИЦ)
    # ========================================================================

    # Минимальный размер границы для исследования (в метрах)
    # Граница меньше этого значения будет игнорироваться
    min_frontier_size: 0.5

    # ========================================================================
    # NAVIGATION (НАВИГАЦИЯ)
    # ========================================================================

    # Частота планирования новых целей (Гц)
    planner_frequency: 1.0

    # Минимальный прогресс (в метрах) для продолжения движения к цели
    # Если робот не продвинулся на это расстояние, цель считается недостижимой
    progress_timeout: 30.0

    # Радиус для определения достижения цели (в метрах)
    goal_dist_tolerance: 0.3

    # ========================================================================
    # EXPLORATION STRATEGY (СТРАТЕГИЯ ИССЛЕДОВАНИЯ)
    # ========================================================================

    # Минимальное расстояние от робота до потенциальной цели (метры)
    # Слишком близкие цели будут игнорироваться
    potential_scale: 0.01

    # Коэффициент ориентации - предпочтение целей в направлении движения
    orientation_scale: 0.0  # 0 = не учитывать ориентацию

    # Коэффициент усиления для выбора целей
    gain_scale: 1.0

    # ========================================================================
    # TRANSFORM (ТРАНСФОРМАЦИИ)
    # ========================================================================

    # Таймаут ожидания трансформаций (секунды)
    transform_tolerance: 0.3

# ============================================================================
# ПРИМЕЧАНИЯ ПО COSTMAP
# ============================================================================
# ВАЖНО: Global costmap запускается Nav2 (через nav2_bringup.launch.py)
# с параметрами из nav2_params.yaml. Explore lite только подписывается
# на топики /global_costmap/costmap и /global_costmap/costmap_updates.
#
# Убедитесь что в nav2_params.yaml для global_costmap установлено:
# - track_unknown_space: true  (критично для frontier exploration!)
# - rolling_window: false
# - width и height подходящие для размера помещения
#
# ============================================================================
# ПРИМЕЧАНИЯ ПО НАСТРОЙКЕ
# ============================================================================
#
# Настройка для разных сценариев:
#
# 1. Маленькая комната (3x3м):
#    - width: 10, height: 10
#    - min_frontier_size: 0.3
#    - planner_frequency: 0.5
#
# 2. Большое помещение (10x10м):
#    - width: 30, height: 30
#    - min_frontier_size: 0.8
#    - planner_frequency: 1.0
#
# 3. Быстрое исследование:
#    - planner_frequency: 2.0
#    - progress_timeout: 15.0
#
# 4. Осторожное исследование:
#    - inflation_radius: 0.70
#    - goal_dist_tolerance: 0.4
#
# ============================================================================