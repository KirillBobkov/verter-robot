# Laser Filter Configuration for Verter Robot (ROS2 format)
#
# Problem: RPLiDAR A1M8 is mounted at the front of the robot (~25cm forward).
# The back sector (180°) sees the robot body.
#
# Solution: Filter out the back 180°, keeping only the front 180° FOV.
#
# Angle convention (ROS standard):
#   0° (0 rad)      = forward (+X)
#   90° (π/2 rad)   = left (+Y)
#   180° (π rad)    = back (-X)
#   -90° (-π/2 rad) = right (-Y)
#
# We keep: -90° to +90° (front 180°)
# We filter out: 90° to 270° (back 180°)

laser_filter:
  ros__parameters:
    filter1:
      name: range_filter
      type: laser_filters/LaserScanRangeFilter
      params:
        # Отсечь точки ближе 20см (корпус робота) и дальше 10м (шум/отражения)
        lower_threshold: 0.20
        upper_threshold: 10.0
        use_message_range_limits: false
    filter2:
      name: angular_bounds
      type: laser_filters/LaserScanAngularBoundsFilterInPlace
      params:
        # Keep angles from -90° to +90° (front 180° FOV)
        lower_angle: -1.5708
        upper_angle: 1.5708
