# SLAM Toolbox Configuration for Verter Robot
# Based on robot specifications and sensor setup
#
# Robot parameters:
# - Wheelbase: ~0.22m
# - Max velocity: 0.5 m/s
# - Differential drive with odometry
# - 7 ultrasonic sensors converted to LaserScan
#
# Scan topic: /scan (from ultrasonic_to_laserscan_node)
# Odometry topic: /odom (from odometry_node)
# Base frame: base_link
# Odom frame: odom

slam_toolbox:
  ros__parameters:

    # ROS Parameters
    odom_frame: odom
    map_frame: map
    base_frame: base_link
    scan_topic: /scan
    use_map_saver: true
    mode: mapping  # Options: mapping, localization

    # Debugging
    debug_logging: false
    throttle_scans: 1  # Process every N scans (1 = all scans)

    # TF Parameters
    transform_publish_period: 0.05  # 20 Hz (matching controller)
    tf_buffer_duration: 30.0
    transform_timeout: 0.5
    use_sim_time: true

    # General Parameters
    stack_size_to_use: 40000000  # Program stack size to execute

    # Position Variance (uncertainty in position)
    # For odometry-based SLAM with differential drive
    # Уменьшено для более частого обновления карты в RViz
    minimum_travel_distance: 0.01  # 1 см минимальное расстояние для обновления
    minimum_travel_heading: 0.01   # ~0.57° минимальный поворот

    # Scan Matching Parameters
    scan_buffer_size: 10
    scan_buffer_maximum_scan_distance: 10.0
    link_match_minimum_response_fine: 0.1
    link_scan_maximum_distance: 1.5
    loop_search_maximum_distance: 3.0
    do_loop_closing: true
    loop_match_minimum_chain_size: 10
    loop_match_maximum_variance_coarse: 3.0
    loop_match_minimum_response_coarse: 0.35
    loop_match_minimum_response_fine: 0.45

    # Correlation Parameters for Scan Matching
    correlation_search_space_dimension: 0.5
    correlation_search_space_resolution: 0.01
    correlation_search_space_smear_deviation: 0.1

    # Loop Closure Parameters
    loop_search_space_dimension: 8.0
    loop_search_space_resolution: 0.05
    loop_search_space_smear_deviation: 0.03

    # Scan Matcher Parameters
    distance_variance_penalty: 0.5
    angle_variance_penalty: 1.0

    # Fine Search Parameters
    fine_search_angle_offset: 0.00349
    coarse_search_angle_offset: 0.349
    coarse_angle_resolution: 0.0349
    minimum_angle_penalty: 0.9
    minimum_distance_penalty: 0.5
    use_response_expansion: true

    # Laser Scanner Parameters (ToF Camera depth range)
    # Matching the capabilities of the ToF camera in simulation
    minimum_range: 0.1  # 10 cm - minimum range
    maximum_range: 4.0   # 4 m - maximum range of ToF camera
    minimum_laser_range: 0.1
    maximum_laser_range: 4.0

    # Solver plugin parameters
    solver_plugin: solver_plugins::CeresSolver
    ceres_linear_solver: SPARSE_NORMAL_CHOLESKY
    ceres_preconditioner: SCHUR_JACOBI
    ceres_trust_strategy: LEVENBERG_MARQUARDT
    ceres_dogleg_type: TRADITIONAL_DOGLEG
    ceres_loss_function: None