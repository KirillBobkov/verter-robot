# SLAM Toolbox Configuration for Verter Robot
# Based on robot specifications and sensor setup
#
# Robot parameters:
# - Wheel base: 0.356m (расстояние между колёсами)
# - Wheel circumference: 0.63m (длина окружности колеса)
# - Max velocity: 0.5 m/s
# - Differential drive with encoder-based odometry
#
# Sensors:
# - RPLiDAR A1M8 (scan topic: /scan)
# - 7x HC-SR04 ultrasonic sensors (optional)
#
# Frames:
# - Scan topic: /scan (from rplidar_node)
# - Odometry topic: /odom (from odometry_node, encoder-based)
# - Base frame: base_link
# - Odom frame: odom
# - Lidar frame: lidar_link

slam_toolbox:
  ros__parameters:

    # ROS Parameters
    odom_frame: odom
    map_frame: map
    base_frame: base_footprint
    scan_topic: /scan
    use_map_saver: true
    mode: mapping  # Options: mapping, localization

    # Map saving parameters
    map_file_name: /tmp/slam_toolbox_map  # Default save location
    map_start_pose: [0.0, 0.0, 0.0]  # x, y, yaw

    # Debugging
    debug_logging: false
    throttle_scans: 1  # Process every N scans (1 = all scans)

    # TF Parameters
    transform_publish_period: 0.05  # 20 Hz (matching controller)
    tf_buffer_duration: 30.0
    transform_timeout: 0.5
    use_sim_time: false  # Real robot - use system time!

    # General Parameters
    stack_size_to_use: 40000000  # Program stack size to execute

    # Position Variance (uncertainty in position)
    # For odometry-based SLAM with differential drive
    # Lower values = more frequent updates, better for indoor mapping
    minimum_travel_distance: 0.1   # Update after 10cm movement (was 0.2 - too sparse)
    minimum_travel_heading: 0.05   # Update after ~3° rotation

    # Scan Matching Parameters
    scan_buffer_size: 10
    scan_buffer_maximum_scan_distance: 10.0
    link_match_minimum_response_fine: 0.1  # Default: 0.1 (was 0.3 - too strict!)
    link_scan_maximum_distance: 1.5
    loop_search_maximum_distance: 3.0
    do_loop_closing: true
    loop_match_minimum_chain_size: 10
    loop_match_maximum_variance_coarse: 3.0
    loop_match_minimum_response_coarse: 0.35
    loop_match_minimum_response_fine: 0.45

    # Correlation Parameters for Scan Matching
    correlation_search_space_dimension: 0.5
    correlation_search_space_resolution: 0.01
    correlation_search_space_smear_deviation: 0.1

    # Loop Closure Parameters
    loop_search_space_dimension: 8.0
    loop_search_space_resolution: 0.05
    loop_search_space_smear_deviation: 0.03

    # Scan Matcher Parameters
    # Controls how much to penalize deviations in distance/angle matching
    # Lower values = trust scan matching more; Higher = trust odometry more
    distance_variance_penalty: 0.3  # Default: 0.3 (was 0.5)
    angle_variance_penalty: 1.0     # Default: 1.0 (keep as is)

    # Fine Search Parameters
    fine_search_angle_offset: 0.00349
    coarse_search_angle_offset: 0.349
    coarse_angle_resolution: 0.0349
    minimum_angle_penalty: 0.9
    minimum_distance_penalty: 0.5
    use_response_expansion: true

    # Laser Scanner Parameters (RPLiDAR A1M8)
    # Specs: 360° scanner, but filtered to 180° FOV (back blocked by robot body)
    # Range: 0.15-12m, Frequency: ~5.5 Hz
    # Mounted at ~55cm height, 25cm forward from robot center
    minimum_time_interval: 0.01  # Minimum time between scans (5.5Hz = ~180ms)
    max_laser_range: 6.0         # Ограничение дальности для чистой карты
    minimum_range: 0.20          # Отсечь ближний шум (корпус)
    range_threshold: 5.5         # Использовать до 5.5м для маппинга

    # Solver plugin parameters
    # Optimized for Jetson Orin Nano (6-core CPU)
    solver_plugin: solver_plugins::CeresSolver
    ceres_linear_solver: SPARSE_NORMAL_CHOLESKY  # Parallel solver, uses all cores
    ceres_preconditioner: SCHUR_JACOBI
    ceres_trust_strategy: LEVENBERG_MARQUARDT
    ceres_dogleg_type: TRADITIONAL_DOGLEG
    ceres_loss_function: None
    num_threads: 6  # Use all 6 Cortex-A78AE cores on Jetson Orin Nano