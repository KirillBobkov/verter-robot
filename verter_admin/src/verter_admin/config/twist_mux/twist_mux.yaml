# Конфигурация twist_mux для робота Verter
# Чем выше priority - тем выше приоритет источника

twist_mux:
  ros__parameters:
    topics:
      # Приоритет 200: Экстренная остановка (датчики безопасности)
      safety_stop:
        topic   : /safety/cmd_vel
        timeout : 0.5
        priority: 200

      # Приоритет 100: Ручное управление с клавиатуры
      teleop_keyboard:
        topic   : /teleop_keyboard/cmd_vel
        timeout : 0.5
        priority: 100

      # Приоритет 90: Джойстик (если будет)
      teleop_joy:
        topic   : /teleop_joy/cmd_vel
        timeout : 0.5
        priority: 90

      # Приоритет 10: Навигация Nav2
      navigation:
        topic   : /nav2/cmd_vel
        timeout : 0.5
        priority: 10

    # Блокировки (опционально)
    locks:
      # Когда телеоп активен, блокирует nav2
      teleop_lock:
        topic   : /teleop_keyboard/lock
        timeout : 0.0
        priority: 100
