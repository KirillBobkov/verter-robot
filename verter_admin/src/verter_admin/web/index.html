<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Verter - Waypoint Manager</title>
<script src="https://cdn.jsdelivr.net/npm/eventemitter2@6.4.9/lib/eventemitter2.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/roslib@1.4.0/build/roslib.min.js"></script>
<style>
* { margin: 0; padding: 0; box-sizing: border-box; }
body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; background: #1a1a2e; color: #e0e0e0; height: 100vh; display: flex; flex-direction: column; overflow: hidden; }

/* Top bar */
.topbar { display: flex; align-items: center; gap: 12px; padding: 8px 16px; background: #16213e; border-bottom: 1px solid #0f3460; flex-shrink: 0; }
.topbar h1 { font-size: 16px; color: #e94560; margin-right: auto; }
.topbar input { background: #0f3460; border: 1px solid #533483; color: #e0e0e0; padding: 4px 8px; border-radius: 4px; font-size: 13px; width: 240px; }
.topbar button { background: #0f3460; border: 1px solid #533483; color: #e0e0e0; padding: 4px 12px; border-radius: 4px; cursor: pointer; font-size: 13px; }
.topbar button:hover { background: #533483; }
.status-dot { width: 10px; height: 10px; border-radius: 50%; background: #555; flex-shrink: 0; }
.status-dot.connected { background: #4caf50; }
.status-dot.error { background: #e94560; }
.status-text { font-size: 12px; color: #888; }

/* Main layout */
.main { display: flex; flex: 1; overflow: hidden; }

/* Canvas area */
.canvas-wrap { flex: 7; position: relative; background: #111; overflow: hidden; cursor: crosshair; }
.canvas-wrap canvas { display: block; position: absolute; top: 0; left: 0; }
.canvas-info { position: absolute; bottom: 8px; left: 8px; font-size: 11px; color: #888; background: rgba(0,0,0,0.6); padding: 2px 6px; border-radius: 3px; pointer-events: none; }
.click-mode-badge { position: absolute; top: 8px; left: 8px; font-size: 12px; padding: 4px 10px; border-radius: 4px; pointer-events: none; }
.click-mode-badge.active { background: rgba(233,69,96,0.85); color: #fff; }
.click-mode-badge.inactive { background: rgba(0,0,0,0.4); color: #888; }

/* Sidebar */
.sidebar { flex: 3; min-width: 280px; max-width: 380px; display: flex; flex-direction: column; background: #16213e; border-left: 1px solid #0f3460; overflow: hidden; }
.sidebar h2 { font-size: 14px; padding: 10px 12px 6px; color: #e94560; }

/* Nav status */
.nav-status { padding: 6px 12px; font-size: 12px; border-bottom: 1px solid #0f3460; min-height: 32px; display: flex; align-items: center; gap: 8px; }
.nav-status .badge { padding: 2px 8px; border-radius: 3px; font-size: 11px; font-weight: 600; }
.badge-idle { background: #333; color: #aaa; }
.badge-navigating { background: #1565c0; color: #fff; }
.badge-succeeded { background: #2e7d32; color: #fff; }
.badge-error, .badge-cancelled { background: #c62828; color: #fff; }

/* Add forms */
.add-section { padding: 8px 12px; border-bottom: 1px solid #0f3460; }
.add-section label { font-size: 12px; color: #888; display: block; margin-bottom: 4px; }
.add-row { display: flex; gap: 6px; margin-bottom: 6px; }
.add-row input { flex: 1; background: #0f3460; border: 1px solid #533483; color: #e0e0e0; padding: 4px 6px; border-radius: 3px; font-size: 12px; }
.add-row input.short { max-width: 70px; }
.btn { background: #0f3460; border: 1px solid #533483; color: #e0e0e0; padding: 4px 10px; border-radius: 3px; cursor: pointer; font-size: 12px; white-space: nowrap; }
.btn:hover { background: #533483; }
.btn-go { background: #1565c0; border-color: #1565c0; }
.btn-go:hover { background: #1976d2; }
.btn-del { background: #c62828; border-color: #c62828; }
.btn-del:hover { background: #e53935; }
.btn-cancel { background: #e65100; border-color: #e65100; }
.btn-cancel:hover { background: #f57c00; }
.btn-save { background: #2e7d32; border-color: #2e7d32; }
.btn-save:hover { background: #43a047; }
.btn-add-map { background: #e94560; border-color: #e94560; }
.btn-add-map:hover { background: #ff6b81; }

/* Waypoint list */
.wp-list { flex: 1; overflow-y: auto; padding: 4px 0; }
.wp-item { display: flex; align-items: center; padding: 6px 12px; border-bottom: 1px solid rgba(15,52,96,0.5); gap: 8px; }
.wp-item:hover { background: rgba(83,52,131,0.15); }
.wp-info { flex: 1; min-width: 0; }
.wp-name { font-size: 13px; font-weight: 500; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.wp-coords { font-size: 11px; color: #888; }
.wp-desc { font-size: 11px; color: #666; font-style: italic; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.wp-actions { display: flex; gap: 4px; flex-shrink: 0; }

/* Robot position */
.robot-pos { padding: 6px 12px; border-top: 1px solid #0f3460; font-size: 11px; color: #888; flex-shrink: 0; }
</style>
</head>
<body>

<!-- Top bar -->
<div class="topbar">
  <h1>Verter Waypoints</h1>
  <label style="font-size:12px;color:#888;">rosbridge:</label>
  <input id="rosbridgeUrl" value="ws://localhost:9090" placeholder="ws://host:9090">
  <button id="connectBtn" onclick="toggleConnection()">Connect</button>
  <div id="statusDot" class="status-dot"></div>
  <span id="statusText" class="status-text">disconnected</span>
</div>

<!-- Main -->
<div class="main">
  <!-- Canvas -->
  <div class="canvas-wrap" id="canvasWrap">
    <canvas id="mapCanvas"></canvas>
    <div class="canvas-info" id="canvasInfo">No map</div>
    <div id="clickModeBadge" class="click-mode-badge inactive">Click to add: OFF</div>
  </div>

  <!-- Sidebar -->
  <div class="sidebar">
    <h2>Navigation</h2>

    <!-- Nav status -->
    <div class="nav-status" id="navStatus">
      <span class="badge badge-idle">idle</span>
    </div>

    <h2>Add waypoint</h2>
    <div class="add-section">
      <label>Save current position</label>
      <div class="add-row">
        <input id="addCurrentName" placeholder="Name">
        <button class="btn btn-save" onclick="addCurrentPosition()">Save pos</button>
      </div>
      <div style="margin-top:6px;">
        <button id="addMapBtn" class="btn btn-add-map" onclick="toggleClickMode()">Click on map: OFF</button>
        <button class="btn btn-cancel" onclick="cancelNav()" style="margin-left:4px;">Cancel nav</button>
      </div>
    </div>

    <h2>Waypoints</h2>
    <div class="wp-list" id="wpList"></div>

    <div class="robot-pos" id="robotPos">Robot: unknown</div>
  </div>
</div>

<!-- Click-to-add dialog (hidden) -->
<div id="addDialog" style="display:none; position:fixed; top:50%; left:50%; transform:translate(-50%,-50%); background:#16213e; border:1px solid #533483; border-radius:8px; padding:16px; z-index:100; min-width:260px;">
  <h3 style="font-size:14px; margin-bottom:10px; color:#e94560;">Add waypoint</h3>
  <div class="add-row"><input id="dlgName" placeholder="Name"></div>
  <div class="add-row"><input id="dlgDesc" placeholder="Description (optional)"></div>
  <div class="add-row">
    <label style="font-size:12px;color:#888;line-height:28px;">Yaw (rad):</label>
    <input id="dlgYaw" value="0.0" class="short">
  </div>
  <div style="font-size:12px;color:#888;margin-bottom:8px;" id="dlgCoords"></div>
  <div class="add-row">
    <button class="btn btn-save" onclick="confirmAddFromMap()">Add</button>
    <button class="btn" onclick="closeDialog()">Cancel</button>
  </div>
</div>
<div id="addOverlay" style="display:none; position:fixed; inset:0; background:rgba(0,0,0,0.4); z-index:99;" onclick="closeDialog()"></div>

<script>
// ============================================================
// State
// ============================================================
let ros = null;
let connected = false;
let waypoints = [];
let navStatus = {state:'idle', target:'', message:''};
let robotPose = null; // {x, y, yaw}
let clickMode = false;
let pendingMapClick = null; // {x, y} in map coords

// Map data
let mapData = null; // {info: {width, height, resolution, origin}, data: [...]}
let mapImage = null; // ImageData rendered to offscreen canvas

// Pan/zoom
let camX = 0, camY = 0, camZoom = 1;
let dragging = false, dragStartX = 0, dragStartY = 0, camStartX = 0, camStartY = 0;

// Topics
let cmdPub = null;
let mapSub = null, poseSub = null, wpSub = null, statusSub = null;

const canvas = document.getElementById('mapCanvas');
const ctx = canvas.getContext('2d');

// ============================================================
// Connection
// ============================================================
function toggleConnection() {
  if (connected) { disconnect(); return; }
  connect();
}

function connect() {
  const url = document.getElementById('rosbridgeUrl').value.trim();
  if (!url) return;
  setStatus('connecting', 'connecting...');

  ros = new ROSLIB.Ros({ url: url });

  ros.on('connection', () => {
    connected = true;
    setStatus('connected', 'connected');
    document.getElementById('connectBtn').textContent = 'Disconnect';
    subscribe();
  });

  ros.on('error', (err) => {
    setStatus('error', 'error');
  });

  ros.on('close', () => {
    connected = false;
    setStatus('error', 'disconnected');
    document.getElementById('connectBtn').textContent = 'Connect';
  });
}

function disconnect() {
  if (ros) ros.close();
  connected = false;
  setStatus('error', 'disconnected');
  document.getElementById('connectBtn').textContent = 'Connect';
}

function setStatus(state, text) {
  const dot = document.getElementById('statusDot');
  dot.className = 'status-dot' + (state === 'connected' ? ' connected' : state === 'error' ? ' error' : '');
  document.getElementById('statusText').textContent = text;
}

// ============================================================
// ROS subscriptions
// ============================================================
function subscribe() {
  // Command publisher
  cmdPub = new ROSLIB.Topic({ ros, name: '/waypoint_manager/command', messageType: 'std_msgs/String' });

  // Waypoints list
  wpSub = new ROSLIB.Topic({ ros, name: '/waypoint_manager/waypoints', messageType: 'std_msgs/String' });
  wpSub.subscribe(msg => {
    try { waypoints = JSON.parse(msg.data); } catch(e) {}
    renderWaypointList();
    renderCanvas();
  });

  // Nav status
  statusSub = new ROSLIB.Topic({ ros, name: '/waypoint_manager/status', messageType: 'std_msgs/String' });
  statusSub.subscribe(msg => {
    try { navStatus = JSON.parse(msg.data); } catch(e) {}
    renderNavStatus();
  });

  // Robot pose
  poseSub = new ROSLIB.Topic({ ros, name: '/amcl_pose', messageType: 'geometry_msgs/PoseWithCovarianceStamped' });
  poseSub.subscribe(msg => {
    const p = msg.pose.pose;
    const q = p.orientation;
    const yaw = Math.atan2(2.0*(q.w*q.z + q.x*q.y), 1.0 - 2.0*(q.y*q.y + q.z*q.z));
    robotPose = { x: p.position.x, y: p.position.y, yaw };
    document.getElementById('robotPos').textContent =
      `Robot: x=${robotPose.x.toFixed(2)}, y=${robotPose.y.toFixed(2)}, yaw=${robotPose.yaw.toFixed(2)} rad`;
    renderCanvas();
  });

  // Map
  mapSub = new ROSLIB.Topic({ ros, name: '/map', messageType: 'nav_msgs/OccupancyGrid' });
  mapSub.subscribe(msg => {
    mapData = {
      width: msg.info.width,
      height: msg.info.height,
      resolution: msg.info.resolution,
      origin: { x: msg.info.origin.position.x, y: msg.info.origin.position.y },
      data: msg.data,
    };
    buildMapImage();
    // Auto-center on first map
    if (camZoom === 1 && camX === 0 && camY === 0) autoCenterMap();
    renderCanvas();
    document.getElementById('canvasInfo').textContent =
      `Map: ${mapData.width}x${mapData.height}, res=${mapData.resolution}m/px`;
  });
}

// ============================================================
// Map image
// ============================================================
function buildMapImage() {
  if (!mapData) return;
  const w = mapData.width, h = mapData.height;
  const offscreen = document.createElement('canvas');
  offscreen.width = w; offscreen.height = h;
  const octx = offscreen.getContext('2d');
  const imgData = octx.createImageData(w, h);
  const d = imgData.data;
  for (let i = 0; i < mapData.data.length; i++) {
    const v = mapData.data[i];
    const pi = i * 4;
    // Flip Y: OccupancyGrid row 0 is bottom, canvas row 0 is top
    const row = Math.floor(i / w);
    const col = i % w;
    const flippedIdx = ((h - 1 - row) * w + col) * 4;
    let r, g, b;
    if (v === -1 || v === 255) { r = 40; g = 40; b = 60; }       // unknown
    else if (v === 0) { r = 200; g = 200; b = 210; }              // free
    else { r = 20; g = 20; b = 30; }                               // occupied
    d[flippedIdx] = r; d[flippedIdx+1] = g; d[flippedIdx+2] = b; d[flippedIdx+3] = 255;
  }
  octx.putImageData(imgData, 0, 0);
  mapImage = offscreen;
}

function autoCenterMap() {
  if (!mapData) return;
  const cw = canvas.width, ch = canvas.height;
  const mw = mapData.width * mapData.resolution;
  const mh = mapData.height * mapData.resolution;
  camZoom = Math.min(cw / (mapData.width + 20), ch / (mapData.height + 20));
  // Center the map origin (0,0) in the viewport
  const mapCenterPx_x = (-mapData.origin.x / mapData.resolution) * camZoom;
  const mapCenterPx_y = (mapData.origin.y / mapData.resolution + mapData.height) * camZoom;
  camX = cw / 2 - mapCenterPx_x;
  camY = ch / 2 - mapCenterPx_y;
}

// ============================================================
// Coordinate transforms
// ============================================================
// Map coords (meters) -> canvas pixel
function mapToCanvas(mx, my) {
  if (!mapData) return {x:0, y:0};
  // Map coords to grid pixel
  const gx = (mx - mapData.origin.x) / mapData.resolution;
  const gy = mapData.height - (my - mapData.origin.y) / mapData.resolution; // flip Y
  // Grid pixel to canvas pixel
  return { x: gx * camZoom + camX, y: gy * camZoom + camY };
}

// Canvas pixel -> map coords (meters)
function canvasToMap(cx, cy) {
  if (!mapData) return {x:0, y:0};
  const gx = (cx - camX) / camZoom;
  const gy = (cy - camY) / camZoom;
  const mx = gx * mapData.resolution + mapData.origin.x;
  const my = (mapData.height - gy) * mapData.resolution + mapData.origin.y;
  return {x: mx, y: my};
}

// ============================================================
// Canvas rendering
// ============================================================
function resizeCanvas() {
  const wrap = document.getElementById('canvasWrap');
  canvas.width = wrap.clientWidth;
  canvas.height = wrap.clientHeight;
  renderCanvas();
}

function renderCanvas() {
  const w = canvas.width, h = canvas.height;
  ctx.clearRect(0, 0, w, h);
  ctx.fillStyle = '#111';
  ctx.fillRect(0, 0, w, h);

  // Draw map
  if (mapImage && mapData) {
    ctx.save();
    ctx.translate(camX, camY);
    ctx.scale(camZoom, camZoom);
    ctx.imageSmoothingEnabled = false;
    ctx.drawImage(mapImage, 0, 0);
    ctx.restore();
  }

  // Draw grid origin crosshair
  if (mapData) {
    const o = mapToCanvas(0, 0);
    ctx.strokeStyle = 'rgba(255,255,255,0.15)';
    ctx.lineWidth = 1;
    ctx.beginPath(); ctx.moveTo(o.x - 20, o.y); ctx.lineTo(o.x + 20, o.y); ctx.stroke();
    ctx.beginPath(); ctx.moveTo(o.x, o.y - 20); ctx.lineTo(o.x, o.y + 20); ctx.stroke();
  }

  // Draw waypoints
  for (const wp of waypoints) {
    const p = mapToCanvas(wp.x, wp.y);
    const isTarget = navStatus.state === 'navigating' && navStatus.target === wp.name;

    // Marker circle
    ctx.beginPath();
    ctx.arc(p.x, p.y, 8, 0, Math.PI * 2);
    ctx.fillStyle = isTarget ? '#1565c0' : '#e94560';
    ctx.fill();
    ctx.strokeStyle = '#fff';
    ctx.lineWidth = 1.5;
    ctx.stroke();

    // Direction tick
    const yaw = wp.yaw || 0;
    ctx.beginPath();
    ctx.moveTo(p.x, p.y);
    ctx.lineTo(p.x + Math.cos(-yaw) * 14, p.y + Math.sin(-yaw) * 14);
    ctx.strokeStyle = isTarget ? '#64b5f6' : '#ff8a80';
    ctx.lineWidth = 2;
    ctx.stroke();

    // Label
    ctx.font = '11px sans-serif';
    ctx.fillStyle = '#fff';
    ctx.textAlign = 'center';
    ctx.fillText(wp.name, p.x, p.y - 12);
  }

  // Draw robot
  if (robotPose && mapData) {
    const r = mapToCanvas(robotPose.x, robotPose.y);
    const size = 10;
    const yaw = -robotPose.yaw; // canvas Y is flipped

    ctx.save();
    ctx.translate(r.x, r.y);
    ctx.rotate(yaw);

    // Arrow body
    ctx.beginPath();
    ctx.moveTo(size, 0);
    ctx.lineTo(-size * 0.6, -size * 0.6);
    ctx.lineTo(-size * 0.3, 0);
    ctx.lineTo(-size * 0.6, size * 0.6);
    ctx.closePath();
    ctx.fillStyle = '#4caf50';
    ctx.fill();
    ctx.strokeStyle = '#fff';
    ctx.lineWidth = 1.5;
    ctx.stroke();

    ctx.restore();
  }

  // Pending click marker
  if (pendingMapClick) {
    const p = mapToCanvas(pendingMapClick.x, pendingMapClick.y);
    ctx.beginPath();
    ctx.arc(p.x, p.y, 10, 0, Math.PI * 2);
    ctx.strokeStyle = '#ffeb3b';
    ctx.lineWidth = 2;
    ctx.setLineDash([4, 4]);
    ctx.stroke();
    ctx.setLineDash([]);
  }
}

// ============================================================
// Pan / Zoom
// ============================================================
canvas.addEventListener('mousedown', e => {
  if (e.button === 0 && !clickMode) {
    dragging = true;
    dragStartX = e.clientX; dragStartY = e.clientY;
    camStartX = camX; camStartY = camY;
    canvas.style.cursor = 'grabbing';
  }
});

canvas.addEventListener('mousemove', e => {
  if (dragging) {
    camX = camStartX + (e.clientX - dragStartX);
    camY = camStartY + (e.clientY - dragStartY);
    renderCanvas();
  }
});

canvas.addEventListener('mouseup', e => {
  if (dragging) { dragging = false; canvas.style.cursor = clickMode ? 'crosshair' : 'grab'; }
});

canvas.addEventListener('mouseleave', () => {
  if (dragging) { dragging = false; canvas.style.cursor = clickMode ? 'crosshair' : 'grab'; }
});

canvas.addEventListener('wheel', e => {
  e.preventDefault();
  const rect = canvas.getBoundingClientRect();
  const mx = e.clientX - rect.left;
  const my = e.clientY - rect.top;
  const factor = e.deltaY < 0 ? 1.15 : 1 / 1.15;
  const newZoom = Math.max(0.1, Math.min(50, camZoom * factor));
  // Zoom toward mouse position
  camX = mx - (mx - camX) * (newZoom / camZoom);
  camY = my - (my - camY) * (newZoom / camZoom);
  camZoom = newZoom;
  renderCanvas();
}, { passive: false });

// Click to add waypoint
canvas.addEventListener('click', e => {
  if (!clickMode || !mapData || dragging) return;
  const rect = canvas.getBoundingClientRect();
  const cx = e.clientX - rect.left;
  const cy = e.clientY - rect.top;
  const m = canvasToMap(cx, cy);
  pendingMapClick = { x: Math.round(m.x * 100) / 100, y: Math.round(m.y * 100) / 100 };
  renderCanvas();
  openDialog();
});

// ============================================================
// Click-to-add mode
// ============================================================
function toggleClickMode() {
  clickMode = !clickMode;
  const btn = document.getElementById('addMapBtn');
  const badge = document.getElementById('clickModeBadge');
  if (clickMode) {
    btn.textContent = 'Click on map: ON';
    badge.textContent = 'Click to add: ON';
    badge.className = 'click-mode-badge active';
    canvas.style.cursor = 'crosshair';
  } else {
    btn.textContent = 'Click on map: OFF';
    badge.textContent = 'Click to add: OFF';
    badge.className = 'click-mode-badge inactive';
    canvas.style.cursor = 'grab';
  }
}

function openDialog() {
  document.getElementById('dlgCoords').textContent =
    `x=${pendingMapClick.x}, y=${pendingMapClick.y}`;
  document.getElementById('dlgName').value = '';
  document.getElementById('dlgDesc').value = '';
  document.getElementById('dlgYaw').value = '0.0';
  document.getElementById('addDialog').style.display = 'block';
  document.getElementById('addOverlay').style.display = 'block';
  document.getElementById('dlgName').focus();
}

function closeDialog() {
  document.getElementById('addDialog').style.display = 'none';
  document.getElementById('addOverlay').style.display = 'none';
  pendingMapClick = null;
  renderCanvas();
}

function confirmAddFromMap() {
  const name = document.getElementById('dlgName').value.trim();
  if (!name || !pendingMapClick) return;
  const desc = document.getElementById('dlgDesc').value.trim();
  const yaw = parseFloat(document.getElementById('dlgYaw').value) || 0;
  sendCommand({
    action: 'add',
    name: name,
    x: pendingMapClick.x,
    y: pendingMapClick.y,
    yaw: yaw,
    description: desc,
  });
  closeDialog();
}

// ============================================================
// Commands
// ============================================================
function sendCommand(cmd) {
  if (!cmdPub || !connected) return;
  cmdPub.publish(new ROSLIB.Message({ data: JSON.stringify(cmd) }));
}

function addCurrentPosition() {
  const name = document.getElementById('addCurrentName').value.trim();
  if (!name) { document.getElementById('addCurrentName').focus(); return; }
  sendCommand({ action: 'add_current', name: name, description: '' });
  document.getElementById('addCurrentName').value = '';
}

function navigateTo(name) {
  sendCommand({ action: 'navigate', name: name });
}

function deleteWaypoint(name) {
  if (!confirm(`Delete "${name}"?`)) return;
  sendCommand({ action: 'delete', name: name });
}

function cancelNav() {
  sendCommand({ action: 'cancel' });
}

// ============================================================
// Sidebar renders
// ============================================================
function renderWaypointList() {
  const list = document.getElementById('wpList');
  if (waypoints.length === 0) {
    list.innerHTML = '<div style="padding:12px;color:#666;font-size:12px;">No waypoints</div>';
    return;
  }
  let html = '';
  for (const wp of waypoints) {
    const desc = wp.description ? `<div class="wp-desc">${esc(wp.description)}</div>` : '';
    html += `
    <div class="wp-item">
      <div class="wp-info">
        <div class="wp-name">${esc(wp.name)}</div>
        <div class="wp-coords">x=${wp.x.toFixed(2)}, y=${wp.y.toFixed(2)}, yaw=${(wp.yaw||0).toFixed(2)}</div>
        ${desc}
      </div>
      <div class="wp-actions">
        <button class="btn btn-go" onclick="navigateTo('${escAttr(wp.name)}')">Go</button>
        <button class="btn btn-del" onclick="deleteWaypoint('${escAttr(wp.name)}')">Del</button>
      </div>
    </div>`;
  }
  list.innerHTML = html;
}

function renderNavStatus() {
  const el = document.getElementById('navStatus');
  const s = navStatus;
  const cls = 'badge-' + (s.state || 'idle');
  let text = s.message || s.state || 'idle';
  el.innerHTML = `<span class="badge ${cls}">${esc(s.state||'idle')}</span> <span style="font-size:12px;">${esc(text)}</span>`;
}

function esc(s) { const d = document.createElement('div'); d.textContent = s; return d.innerHTML; }
function escAttr(s) { return s.replace(/\\/g,'\\\\').replace(/'/g,"\\'"); }

// ============================================================
// Init
// ============================================================
window.addEventListener('resize', resizeCanvas);
resizeCanvas();
canvas.style.cursor = 'grab';

// Auto-connect if rosbridge URL has host (not localhost when on remote)
window.addEventListener('load', () => {
  // Try to auto-set rosbridge URL to current host
  if (location.hostname && location.hostname !== 'localhost' && location.hostname !== '127.0.0.1') {
    document.getElementById('rosbridgeUrl').value = `ws://${location.hostname}:9090`;
  }
});
</script>
