<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Verter — Waypoint Navigation</title>
  <script src="https://cdn.jsdelivr.net/npm/roslib@1/build/roslib.min.js"></script>
  <style>
    *, *::before, *::after { box-sizing: border-box; }
    body { font-family: system-ui, sans-serif; max-width: 860px; margin: 0 auto; padding: 20px; background: #f5f5f5; }
    h1 { margin-bottom: 4px; }
    #status { font-size: 0.9em; margin-bottom: 16px; }
    .ok  { color: #2a7; font-weight: bold; }
    .err { color: #c33; font-weight: bold; }
    section { background: #fff; border: 1px solid #ddd; border-radius: 6px; padding: 16px; margin-bottom: 16px; }
    h2 { margin-top: 0; font-size: 1em; color: #444; }
    label { display: block; font-size: 0.85em; margin-top: 8px; }
    input[type=text], input[type=number] {
      display: block; width: 100%; padding: 6px 8px; margin-top: 2px;
      border: 1px solid #bbb; border-radius: 4px; font-size: 0.95em;
    }
    button {
      margin-top: 10px; padding: 8px 16px; border: none; border-radius: 4px;
      background: #2a7; color: #fff; cursor: pointer; font-size: 0.95em;
    }
    button:hover { background: #1a6; }
    button.danger { background: #c44; }
    button.danger:hover { background: #a33; }
    button.secondary { background: #666; }
    button.secondary:hover { background: #444; }
    #waypoint-list { width: 100%; border-collapse: collapse; margin-top: 8px; }
    #waypoint-list th, #waypoint-list td { border: 1px solid #ddd; padding: 6px 10px; text-align: left; font-size: 0.9em; }
    #waypoint-list th { background: #f0f0f0; }
    #log { height: 120px; overflow-y: auto; background: #1a1a2e; color: #aef; font-family: monospace; font-size: 0.8em; padding: 8px; border-radius: 4px; margin-top: 8px; }
    .row { display: flex; gap: 8px; flex-wrap: wrap; }
  </style>
</head>
<body>
  <h1>Verter Waypoint Navigation</h1>
  <div id="status">ROS bridge: <span id="ros-status" class="err">Disconnected</span></div>

  <!-- Save waypoint -->
  <section>
    <h2>Save Waypoint</h2>
    <label>Name <input id="save-name" type="text" placeholder="e.g. kitchen" /></label>
    <div class="row">
      <label style="flex:1">X (m) <input id="save-x" type="number" step="0.01" value="0.0" /></label>
      <label style="flex:1">Y (m) <input id="save-y" type="number" step="0.01" value="0.0" /></label>
      <label style="flex:1">Theta (rad) <input id="save-theta" type="number" step="0.01" value="0.0" /></label>
    </div>
    <button onclick="saveWaypoint()">Save Waypoint</button>
  </section>

  <!-- Navigate / Delete -->
  <section>
    <h2>Navigate / Delete Waypoint</h2>
    <label>Name <input id="nav-name" type="text" placeholder="e.g. kitchen" /></label>
    <div class="row">
      <button onclick="navigateTo()">Navigate To</button>
      <button class="danger" onclick="deleteWaypoint()">Delete</button>
    </div>
  </section>

  <!-- Patrol -->
  <section>
    <h2>Patrol</h2>
    <div class="row">
      <button onclick="startPatrol()">Start Patrol</button>
      <button class="secondary" onclick="stopPatrol()">Stop Patrol</button>
    </div>
  </section>

  <!-- Waypoint list -->
  <section>
    <h2>Saved Waypoints</h2>
    <button onclick="listWaypoints()">Refresh List</button>
    <table id="waypoint-list">
      <thead><tr><th>Name</th><th>X (m)</th><th>Y (m)</th><th>Theta (rad)</th></tr></thead>
      <tbody id="waypoint-tbody"></tbody>
    </table>
  </section>

  <!-- Log -->
  <section>
    <h2>Log</h2>
    <div id="log"></div>
  </section>

  <script>
    // Derive rosbridge host from window.location.hostname so no hard-coded IPs (R10/C10)
    const ROSBRIDGE_PORT = 9090;
    const ROSBRIDGE_HOST = window.location.hostname || 'localhost';

    const ros = new ROSLIB.Ros({ url: `ws://${ROSBRIDGE_HOST}:${ROSBRIDGE_PORT}` });

    ros.on('connection', () => {
      document.getElementById('ros-status').textContent = `Connected (${ROSBRIDGE_HOST}:${ROSBRIDGE_PORT})`;
      document.getElementById('ros-status').className = 'ok';
      log('ROS bridge connected');
    });
    ros.on('error', (e) => {
      document.getElementById('ros-status').textContent = 'Error';
      document.getElementById('ros-status').className = 'err';
      log('ROS bridge error: ' + e);
    });
    ros.on('close', () => {
      document.getElementById('ros-status').textContent = 'Disconnected';
      document.getElementById('ros-status').className = 'err';
      log('ROS bridge disconnected');
    });

    function log(msg) {
      const el = document.getElementById('log');
      const ts = new Date().toISOString().substring(11, 23);
      el.innerHTML += `[${ts}] ${msg}\n`;
      el.scrollTop = el.scrollHeight;
    }

    function callService(name, type, request, onResult) {
      const svc = new ROSLIB.Service({ ros, name, serviceType: type });
      const req = new ROSLIB.ServiceRequest(request);
      svc.callService(req, (res) => {
        log(`${name} → ${JSON.stringify(res)}`);
        if (onResult) onResult(res);
      }, (err) => {
        log(`${name} ERROR: ${err}`);
      });
    }

    function saveWaypoint() {
      const name  = document.getElementById('save-name').value.trim();
      const x     = parseFloat(document.getElementById('save-x').value);
      const y     = parseFloat(document.getElementById('save-y').value);
      const theta = parseFloat(document.getElementById('save-theta').value);
      if (!name) { log('Name is required'); return; }
      callService('/save_waypoint', 'verter_admin_msgs/srv/SaveWaypoint', { name, x, y, theta });
    }

    function navigateTo() {
      const name = document.getElementById('nav-name').value.trim();
      if (!name) { log('Name is required'); return; }
      callService('/navigate_to_waypoint', 'verter_admin_msgs/srv/NavigateToWaypoint', { name });
    }

    function deleteWaypoint() {
      const name = document.getElementById('nav-name').value.trim();
      if (!name) { log('Name is required'); return; }
      if (!confirm(`Delete waypoint '${name}'?`)) return;
      callService('/delete_waypoint', 'verter_admin_msgs/srv/DeleteWaypoint', { name },
        () => listWaypoints());
    }

    function listWaypoints() {
      callService('/list_waypoints', 'verter_admin_msgs/srv/ListWaypoints', {}, (res) => {
        const tbody = document.getElementById('waypoint-tbody');
        tbody.innerHTML = '';
        if (!res.names || res.names.length === 0) {
          tbody.innerHTML = '<tr><td colspan="4" style="color:#999">No waypoints saved</td></tr>';
          return;
        }
        res.names.forEach((n, i) => {
          const row = tbody.insertRow();
          row.insertCell().textContent = n;
          row.insertCell().textContent = res.x[i].toFixed(3);
          row.insertCell().textContent = res.y[i].toFixed(3);
          row.insertCell().textContent = res.theta[i].toFixed(4);
        });
      });
    }

    function startPatrol() {
      callService('/start_patrol', 'std_srvs/srv/Trigger', {});
    }

    function stopPatrol() {
      callService('/stop_patrol', 'std_srvs/srv/Trigger', {});
    }
  </script>
</body>
</html>
